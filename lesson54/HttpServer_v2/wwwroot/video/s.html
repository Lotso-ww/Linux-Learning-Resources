<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草莓熊搜索 🔍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #ffe4e1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .search-card { background-color: #fff; border-radius: 24px; padding: 50px 40px; box-shadow: 0 10px 25px rgba(209,71,117,0.2); width: 90%; max-width: 500px; text-align: center; border: 4px solid #ffb6c1; }
        .search-card h2 { margin-bottom: 20px; color: #d14775; }
        .search-box { display: flex; gap: 10px; }
        .search-box input[type="text"] { flex: 1; padding: 15px; border: 2px solid #ffc0cb; border-radius: 12px; outline: none; font-size: 16px; background-color: #fff0f3; }
        .search-box input[type="text"]:focus { border-color: #d14775; }
        .search-box input[type="submit"] { background-color: #d14775; color: white; border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .search-box input[type="submit"]:hover { background-color: #b0305a; }
        .links { margin-top: 30px; }
        .links a { color: #d14775; text-decoration: none; font-weight: bold; margin: 0 10px; }
    </style>
</head>
<body>
    <div class="search-card">
        <div style="font-size: 50px;">🍓🔎</div>
        <h2>想找点什么？</h2>
        <form action="/app/search" method="get" class="search-box">
            <input type="text" name="keyword" placeholder="输入关键词搜索..." required>
            <input type="submit" value="搜索">
        </form>
        <div class="links">
            <a href="index.html">🏠 回首页</a>
            <a href="https://www.baidu.com" target="_blank">🌐 百度一下</a>
        </div>
    </div>
</body>
</html>
