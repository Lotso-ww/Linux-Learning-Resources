<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草莓熊登录 🍓🐻</title>
    <style>
        /* 基础重置和字体 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe4e1; /* 浅柔粉色背景，草莓熊主题底色 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #800020; 
        }

        /* 登录卡片容器 */
        .login-card {
            background-color: #fff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(209, 71, 117, 0.2);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 4px solid #ffb6c1; /* 草莓粉边框 */
        }

        .login-card h2 {
            margin-bottom: 25px;
            color: #d14775; /* 浆果红/草莓熊主色调 */
            font-size: 24px;
            letter-spacing: 2px;
        }

        /* 表单样式 */
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            color: #d14775;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ffc0cb;
            border-radius: 12px;
            outline: none;
            font-size: 14px;
            background-color: #fff0f3;
            transition: border-color 0.3s, background-color 0.3s;
        }

        .input-group input:focus {
            border-color: #d14775; 
            background-color: #fff;
        }

        /* 提交按钮 */
        input[type="submit"] {
            background-color: #d14775;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 5px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            margin-top: 10px;
        }

        input[type="submit"]:hover {
            background-color: #b0305a;
        }
        
        input[type="submit"]:active {
            transform: scale(0.97);
        }

        /* 底部导航链接 */
        .nav-links {
            margin-top: 40px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            width: 90%;
            max-width: 600px;
        }

        .nav-links a {
            text-decoration: none;
            color: #fff;
            background-color: #ff9cb3;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(209, 71, 117, 0.2);
        }

        .nav-links a:hover {
            background-color: #d14775;
            transform: translateY(-3px);
        }

        /* 顶部装饰性元素 */
        .decoration {
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 登录模块 -->
    <div class="login-card">
        <div class="decoration">🍓🐻</div>
        <h2>用户登录</h2>
        <!-- action: 用户数据提交给谁处理 method：以什么方法进行提交-->
        <form action="/app/login" method="GET">
            <div class="input-group">
                <label for="username">用户名：</label>
                <!-- 增加了 placeholder 和 id，提升体验，但不影响原先的 name 传值 -->
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="input-group">
                <label for="passwd">密码：</label>
                <input type="password" id="passwd" name="passwd" placeholder="请输入密码" required>
            </div>
            <input type="submit" value="登录">
        </form>
    </div>

    <!-- 链接跳转模块 -->
    <div class="nav-links">
        <a href="/s.html">🔍 搜索</a>
        <a href="https://www.baidu.com">🤝 合作方</a>
        <a href="Login.html">👤 登录</a>
        <a href="Register.html">📝 注册</a>
        <a href="content.html">📖 查看文章</a>
    </div>

</body>
</html>
