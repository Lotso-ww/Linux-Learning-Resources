<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找不到页面啦 🐻💔</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #ffe4e1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .error-card { background-color: #fff; border-radius: 24px; padding: 60px 40px; box-shadow: 0 10px 25px rgba(209,71,117,0.2); width: 90%; max-width: 500px; border: 4px dashed #ffb6c1; }
        h1 { font-size: 80px; color: #d14775; margin: 0; line-height: 1; }
        h2 { color: #b0305a; margin: 20px 0; font-size: 22px; }
        p { color: #ff9cb3; margin-bottom: 30px; }
        a { display: inline-block; background-color: #d14775; color: white; padding: 12px 30px; border-radius: 20px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        a:hover { background-color: #b0305a; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>哎呀，页面被草莓熊吃掉啦！</h2>
        <p>这里除了草莓味什么都没有...</p>
        <a href="index.html">带我回首页 🏠</a>
    </div>
</body>
</html>
